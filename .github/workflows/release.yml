name: Build and release Gizmos

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build, type-check and verify public API
        run: npm test

      - name: Pack Cocos Creator extension ZIP
        run: npm run pack

      # Upload a ZIP that Extension Manager can import directly.
      - name: Upload development extension build
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        uses: actions/upload-artifact@v4
        with:
          name: Cocos-Gizmos-extension-${{ github.sha }}
          path: release/Cocos-Gizmos-*.zip
          if-no-files-found: error

      # GITHUB_TOKEN tag pushes do not trigger a second Actions run.
      # After a successful master build, push the version tag and create
      # the Release in THIS run. Manual version tags are supported too.
      - name: Resolve version for release
        id: release
        if: ${{ github.ref_type == 'tag' || github.ref == 'refs/heads/master' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || {
              echo "Tag $GITHUB_REF_NAME does not match package version $tag"; exit 1;
            }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Version $tag already tagged; skipping automatic release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push version tag from master
        if: ${{ github.ref == 'refs/heads/master' && steps.release.outputs.publish == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/Cocos-Gizmos-*.zip
            dist/Gizmos.js
            dist/Gizmos.d.ts

      # Create PhuNope/Cocos-Gizmos-Type with main branch before enabling.
      # Set repository variable TYPES_REPO_READY=true and repository secret
      # TYPES_REPO_TOKEN: fine-grained PAT with target repo Contents read/write.
      - name: Checkout type-only repository
        if: ${{ steps.release.outputs.publish == 'true' && vars.TYPES_REPO_READY == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: PhuNope/Cocos-Gizmos-Type
          ref: main
          token: ${{ secrets.TYPES_REPO_TOKEN }}
          path: types-repo

      - name: Sync type-only package and matching version tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        if: ${{ steps.release.outputs.publish == 'true' && vars.TYPES_REPO_READY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cp dist/Gizmos.d.ts types-repo/Gizmos.d.ts
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.RELEASE_TAG.slice(1);
          fs.writeFileSync('types-repo/package.json', JSON.stringify({
            name: '@types/cocos-gizmos',
            version,
            types: 'Gizmos.d.ts',
            files: ['Gizmos.d.ts'],
            description: 'Global-only type declarations for Cocos-Gizmos',
            license: 'MIT'
          }, null, 2) + '\n');
          NODE
          cd types-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Gizmos.d.ts package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(types): sync $RELEASE_TAG"
            git push origin HEAD:main
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null; then
            git tag "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
